[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobinsight"
version = "1.0.0"
description = "Pipeline Big Data de collecte et d'analyse des offres d'emploi (PFE Master 2 Data Engineering)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "pymongo>=4.6",
    "pyarrow>=14",
    "pandas>=2.0",
]

[project.optional-dependencies]
pipeline = ["confluent-kafka>=2.3", "pyspark==3.5.8"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["jobinsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
